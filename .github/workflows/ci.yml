name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine, API and LLM layer (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pyproject.toml is installed as libraries only: the tests only need the
      # runtime deps, and `pip install -e` would pull duckdb for no reason here.
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy "fastapi>=0.110" uvicorn "pydantic>=2" httpx "openai>=1.50" ruff "psycopg[binary]>=3.2,<4" "python-dotenv>=1,<2"

      - name: Python lint
        run: ruff check services/engine

      - name: Unit tests (dependency-free runner)
        run: python scripts/run_tests.py

      - name: Obsidian links, checklist inventory and ownership
        run: |
          python scripts/audit_vault.py
          python scripts/check_ownership.py --overlaps

      - name: Adversarial suite (30 cases, offline)
        env:
          PYTHONPATH: services/engine
        run: python -m tether_engine.llm.redteam

      - name: API serves template cards with no key and no network
        env:
          LLM_PROVIDER: none
        run: |
          PYTHONPATH=services/engine python - <<'PY'
          from fastapi.testclient import TestClient
          from tether_engine.api.main import app

          client = TestClient(app)
          health = client.get("/api/health").json()
          assert health["llm_provider"] == "none", health
          assert health["llm_key_present"] is False, health
          scenario = client.get("/api/scenario/cmo_fever").json()
          assert scenario["days"], "scenario has no days"
          card = client.post("/api/card", json={"scenario": "cmo_fever", "crew": "A", "day": 15}).json()
          assert card["card_source"] == "template", card["card_source"]
          assert card["card"]["citations"], card
          print("API OK:", card["card"]["level"], "|", card["source"])
          PY

  frontend:
    name: Crew tablet build and browser audit chain (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/crew-tablet/package-lock.json

      - name: Install tablet dependencies
        working-directory: apps/crew-tablet
        run: npm ci

      - name: Typecheck and build
        working-directory: apps/crew-tablet
        run: npm run build

      - name: Physiology simulator regression tests
        working-directory: apps/crew-tablet
        run: npm run test:physiology

      - name: Google OAuth security and session regressions
        working-directory: apps/crew-tablet
        run: npm run test:auth

      - name: Compile Cloudflare authentication functions
        working-directory: apps/crew-tablet
        run: npx wrangler pages functions build --outdir ../../tmp/cloudflare-auth

      # Regression guard: a UI refactor once replaced index.html and lost the
      # Search Console tag, which silently breaks site verification.
      - name: Build keeps the SEO head and sitemap
        run: |
          grep -q 'google-site-verification' apps/crew-tablet/dist/index.html
          test -f apps/crew-tablet/dist/sitemap.xml
          test -f apps/crew-tablet/dist/robots.txt

      - name: Install Chromium for browser integration checks
        working-directory: apps/crew-tablet
        run: npx playwright install --with-deps chromium

      - name: Browser integration checks (static build, no external API)
        working-directory: apps/crew-tablet
        env:
          LIGHTMINUTE_SKIP_API: "1"
        run: npm run test:e2e

      - name: Browser screenshots and verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightminute-browser-evidence
          path: |
            docs/screenshots/
            docs/qa/browser-results.json

      - name: Ground console audit chain matches the Python vectors
        run: node apps/ground-console/src/audit.test.mjs

      - name: Protocol runner parses as a classic script and as a module
        run: |
          node --check packages/protocol-runner/runner.js
          node --check packages/protocol-runner/index.js
          node --check apps/ground-console/src/main.js
          node --check apps/ground-console/src/audit-core.js
