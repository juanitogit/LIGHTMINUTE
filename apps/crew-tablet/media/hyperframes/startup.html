<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body { margin:0; overflow:hidden; }
#root { width:512px; height:512px; position:relative; }
svg { position:absolute; inset:0; width:100%; height:100%; }
</style></head><body>
<div id="root" data-composition-id="lightminute-start" data-start="0" data-width="512" data-height="512">
  <svg viewBox="0 0 512 512" aria-hidden="true">
    <circle id="orbit" cx="256" cy="256" r="194" fill="none" stroke="#7771ee" stroke-width="3" stroke-linecap="round" stroke-dasharray="1220" stroke-dashoffset="1220" opacity=".8"/>
    <circle id="spark" cx="256" cy="62" r="7" fill="#7dded9" opacity="0"/>
  </svg>
</div>
<script src="./gsap.min.js"></script>
<script>
const tl = gsap.timeline({paused:true});
tl.to('#orbit',{strokeDashoffset:0,duration:1.05,ease:'power2.out'},0.05)
  .fromTo('#spark',{opacity:0,scale:.65,transformOrigin:'center'},{opacity:1,scale:1,duration:.35,ease:'power2.out'},.2)
  .to(['#orbit','#spark'],{opacity:0,duration:.35,ease:'power1.inOut'},1.1)
  .to({}, {duration:.05},1.45);
window.__timelines['lightminute-start']=tl;
</script></body></html>
