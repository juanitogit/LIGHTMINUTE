<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LIGHTMINUTE · Verify audit signature</title><style>body{max-width:46rem;margin:3rem auto;padding:0 1rem;font:16px/1.55 system-ui;color:#152739}label{display:block;margin:1.5rem 0}input{display:block;max-width:100%;margin-top:.5rem}button{padding:.7rem 1rem}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><main><h1>Verify an audit signature</h1><p>Verify a signed synthetic audit file on this device. A valid signature proves the bytes match the key; compare the key fingerprint with a trusted copy to establish who signed it.</p><label>Signed audit JSON<input type="file" id="file" accept="application/json,.json"></label><label>Expected SHA-256 public-key fingerprint (optional)<input type="text" id="fingerprint" size="64" autocomplete="off" spellcheck="false"></label><button id="verify" type="button">Verify signature</button><pre id="result" role="status" aria-live="polite"></pre></main><script type="module">
const file=document.getElementById('file'), expected=document.getElementById('fingerprint'), result=document.getElementById('result');
const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
document.getElementById('verify').addEventListener('click',async()=>{try{if(!file.files?.[0])throw Error('Choose a signed JSON file.');if(file.files[0].size>15000000)throw Error('File is too large.');const envelope=JSON.parse(await file.files[0].text());if(envelope.algorithm!=='Ed25519')throw Error('Unsupported signature algorithm.');const publicKey=bytes(envelope.publicKey), fingerprint=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',publicKey)),x=>x.toString(16).padStart(2,'0')).join('');const pin=expected.value.trim().toLowerCase().replaceAll(':','');if(pin && pin!==fingerprint)throw Error('The public-key fingerprint does not match.');const key=await crypto.subtle.importKey('spki',publicKey,{name:'Ed25519'},false,['verify']);const ok=await crypto.subtle.verify('Ed25519',key,bytes(envelope.signature),bytes(envelope.payload));result.textContent=ok?`Signature valid.\nPublic-key SHA-256: ${fingerprint}\n${pin?'Fingerprint matches.':'Signer identity is not verified until you compare the fingerprint independently.'}`:'Signature invalid.';}catch(e){result.textContent=`Verification failed: ${e instanceof Error?e.message:String(e)}`;}});
</script></body></html>
