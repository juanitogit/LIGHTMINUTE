<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#fdfdfe" />
    <script>
      try {
        if (localStorage.getItem("lightminute-design-version") === "2") {
          const theme = localStorage.getItem("lightminute-theme");
          if (theme === "dark" || theme === "light") document.documentElement.dataset.theme = theme;
        }
      } catch { /* storage can be disabled */ }
    </script>
    <meta
      name="description"
      content="LIGHTMINUTE crew tablet: personal baselines, three-lens verdicts and cited Decision Cards for astronauts. Synthetic data only; not a medical device."
    />
    <link rel="icon" type="image/png" href="./assets/lightminute-official.png" />
    <title>LIGHTMINUTE — crew tablet</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This crew tablet needs JavaScript. All data is synthetic; not a medical device.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
