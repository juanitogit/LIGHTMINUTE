[project]
name = "tether-engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "fastapi", "uvicorn", "pydantic>=2", "httpx", "openai>=1.50", "duckdb", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "hypothesis>=6,<7"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
