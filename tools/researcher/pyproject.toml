[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tether-baseline-researcher"
version = "0.1.0"
description = "Offline longitudinal CSV adapter for the LIGHTMINUTE/TETHER engine"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy"]

[project.scripts]
tether-baseline = "tether_baseline:main"

[tool.setuptools]
py-modules = ["tether_baseline"]

