<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lunar Environment</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  svg { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<svg id="scene" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">

  <defs>

    <!-- Space background gradient -->
    <radialGradient id="spaceBg" cx="50%" cy="60%" r="80%">
      <stop offset="0%" stop-color="#030308"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Milky Way nebula -->
    <radialGradient id="nebulaGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a1a4a" stop-opacity="0.18"/>
      <stop offset="40%" stop-color="#1a1535" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <!-- Second nebula -->
    <radialGradient id="nebula2Grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1a30" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#050d1a" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <!-- Earth base gradient (illuminated from right) -->
    <radialGradient id="earthBase" cx="62%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#2a6fbe"/>
      <stop offset="20%" stop-color="#1e5a9e"/>
      <stop offset="45%" stop-color="#1a4b7a"/>
      <stop offset="65%" stop-color="#163d62"/>
      <stop offset="85%" stop-color="#0d2a45"/>
      <stop offset="100%" stop-color="#061520"/>
    </radialGradient>

    <!-- Earth continents overlay -->
    <radialGradient id="earthLand" cx="45%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#2d7a4a" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#245e38" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#1a4a2a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <!-- Earth atmosphere halo -->
    <radialGradient id="earthAtmo" cx="50%" cy="50%" r="50%">
      <stop offset="78%" stop-color="#0066cc" stop-opacity="0"/>
      <stop offset="88%" stop-color="#2288ff" stop-opacity="0.35"/>
      <stop offset="93%" stop-color="#55aaff" stop-opacity="0.55"/>
      <stop offset="97%" stop-color="#88ccff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#aaddff" stop-opacity="0"/>
    </radialGradient>

    <!-- Earth specular highlight -->
    <radialGradient id="earthSpec" cx="68%" cy="32%" r="35%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#aaccff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>

    <!-- Earth terminator shadow -->
    <radialGradient id="earthShadow" cx="20%" cy="55%" r="65%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <!-- Earth clouds -->
    <filter id="cloudBlur">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>

    <!-- Atmosphere glow filter -->
    <filter id="atmoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Star glow filter -->
    <filter id="starGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Bright star filter -->
    <filter id="brightStarGlow" x="-400%" y="-400%" width="900%" height="900%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Moon surface gradient -->
    <linearGradient id="moonSurf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a5650"/>
      <stop offset="20%" stop-color="#6e6a62"/>
      <stop offset="50%" stop-color="#8a8578"/>
      <stop offset="75%" stop-color="#9b9488"/>
      <stop offset="90%" stop-color="#b0a898"/>
      <stop offset="100%" stop-color="#8a8578"/>
    </linearGradient>

    <!-- Moon horizon blend -->
    <linearGradient id="moonHorizon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a7570" stop-opacity="0.9"/>
      <stop offset="15%" stop-color="#8a8578" stop-opacity="1"/>
      <stop offset="100%" stop-color="#6a6560" stop-opacity="1"/>
    </linearGradient>

    <!-- Moon foreground gradient (brighter, more detail) -->
    <linearGradient id="moonFG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a5650"/>
      <stop offset="30%" stop-color="#7a7570"/>
      <stop offset="60%" stop-color="#9b9488"/>
      <stop offset="85%" stop-color="#c0bab0"/>
      <stop offset="100%" stop-color="#9b9488"/>
    </linearGradient>

    <!-- Crater shadow gradient -->
    <radialGradient id="craterShadow1" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#3a3830" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#4a4840" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8a8578" stop-opacity="0"/>
    </radialGradient>

    <!-- Rock shadow gradient -->
    <radialGradient id="rockShadow" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#c0bab0" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#9b9488" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#5a5650" stop-opacity="0.9"/>
    </radialGradient>

    <!-- Earth clip path -->
    <clipPath id="earthClip">
      <circle cx="1340" cy="380" r="240"/>
    </clipPath>

    <!-- Footprint clip -->
    <filter id="dustBlur">
      <feGaussianBlur stdDeviation="1"/>
    </filter>

    <!-- Satellite gradient -->
    <linearGradient id="satGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d0d8e0"/>
      <stop offset="100%" stop-color="#8090a0"/>
    </linearGradient>

    <!-- Module gradient -->
    <linearGradient id="moduleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c8c0b0"/>
      <stop offset="50%" stop-color="#a09880"/>
      <stop offset="100%" stop-color="#706860"/>
    </linearGradient>

    <!-- Sun lens flare gradient -->
    <radialGradient id="sunFlare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffde0" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#ffe8a0" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#ffcc60" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>

    <!-- Animation: atmosphere pulse -->
    <animate id="atmoPulse"/>

  </defs>

  <!-- === SPACE BACKGROUND === -->
  <rect width="1920" height="1080" fill="url(#spaceBg)"/>

  <!-- Milky Way nebula regions (very subtle) -->
  <ellipse cx="800" cy="300" rx="600" ry="280" fill="url(#nebulaGrad)" opacity="1"/>
  <ellipse cx="400" cy="180" rx="350" ry="200" fill="url(#nebula2Grad)" opacity="1"/>
  <ellipse cx="1600" cy="250" rx="400" ry="200" fill="url(#nebulaGrad)" opacity="0.7"/>

  <!-- Stars container (populated by JS) -->
  <g id="stars"/>
  <g id="brightStars"/>

  <!-- === EARTH === -->
  <!-- Atmosphere outer glow (animated pulse) -->
  <circle cx="1340" cy="380" r="275" fill="none" stroke="#3399ff" stroke-width="22"
          stroke-opacity="0.12" filter="url(#atmoGlow)">
    <animate attributeName="stroke-opacity" values="0.12;0.19;0.12" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="275;278;275" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1340" cy="380" r="258" fill="none" stroke="#66bbff" stroke-width="8" stroke-opacity="0.22">
    <animate attributeName="stroke-opacity" values="0.22;0.32;0.22" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Earth sphere -->
  <g clip-path="url(#earthClip)">
    <!-- Base ocean -->
    <circle cx="1340" cy="380" r="240" fill="url(#earthBase)"/>

    <!-- Continent patches -->
    <!-- North America region -->
    <ellipse cx="1230" cy="310" rx="80" ry="65" fill="#2d6a40" opacity="0.55"/>
    <ellipse cx="1215" cy="345" rx="55" ry="45" fill="#245a35" opacity="0.45"/>
    <!-- Europe/Africa region -->
    <ellipse cx="1360" cy="295" rx="55" ry="70" fill="#2a6038" opacity="0.5"/>
    <ellipse cx="1370" cy="385" rx="50" ry="80" fill="#256035" opacity="0.45"/>
    <!-- Asia region -->
    <ellipse cx="1460" cy="280" rx="90" ry="60" fill="#2d6540" opacity="0.5"/>
    <ellipse cx="1480" cy="330" rx="65" ry="50" fill="#245535" opacity="0.4"/>
    <!-- South America -->
    <ellipse cx="1250" cy="435" rx="40" ry="65" fill="#2a5e35" opacity="0.4"/>
    <!-- Australia -->
    <ellipse cx="1490" cy="430" rx="45" ry="30" fill="#2a6038" opacity="0.35"/>
    <!-- Antarctica -->
    <ellipse cx="1340" cy="590" rx="100" ry="30" fill="#d0dce8" opacity="0.6"/>

    <!-- Land gradient overlay -->
    <circle cx="1340" cy="380" r="240" fill="url(#earthLand)"/>

    <!-- Ice caps -->
    <ellipse cx="1340" cy="155" rx="80" ry="22" fill="#d8e8f0" opacity="0.75"/>
    <ellipse cx="1340" cy="600" rx="90" ry="20" fill="#d0dce8" opacity="0.6"/>

    <!-- Clouds layer -->
    <g filter="url(#cloudBlur)" opacity="0.85">
      <!-- Cloud bands -->
      <ellipse cx="1270" cy="320" rx="90" ry="22" fill="#e8eef4" opacity="0.9"/>
      <ellipse cx="1200" cy="338" rx="60" ry="15" fill="#dde5ee" opacity="0.8"/>
      <ellipse cx="1380" cy="295" rx="75" ry="18" fill="#e5ecf5" opacity="0.85"/>
      <ellipse cx="1420" cy="355" rx="85" ry="20" fill="#ddeaf5" opacity="0.8"/>
      <ellipse cx="1310" cy="420" rx="70" ry="16" fill="#e0e8f0" opacity="0.75"/>
      <ellipse cx="1240" cy="395" rx="55" ry="14" fill="#dce5ee" opacity="0.7"/>
      <ellipse cx="1460" cy="420" rx="50" ry="13" fill="#dde6f0" opacity="0.7"/>
      <!-- Storm system spiral suggestion -->
      <ellipse cx="1180" cy="360" rx="40" ry="40" fill="none" stroke="#e8eef5" stroke-width="10" stroke-opacity="0.5"/>
      <ellipse cx="1480" cy="300" rx="30" ry="30" fill="none" stroke="#e5ecf5" stroke-width="8" stroke-opacity="0.4"/>
    </g>

    <!-- Specular ocean highlight -->
    <circle cx="1340" cy="380" r="240" fill="url(#earthSpec)"/>

    <!-- Terminator/shadow from left -->
    <circle cx="1340" cy="380" r="240" fill="url(#earthShadow)"/>
  </g>

  <!-- Atmosphere halo ring -->
  <circle cx="1340" cy="380" r="240" fill="url(#earthAtmo)"/>

  <!-- === SATELLITE IN ORBIT === -->
  <g id="satellite">
    <!-- Satellite body -->
    <rect x="-10" y="-5" width="20" height="10" rx="2" fill="url(#satGrad)"/>
    <!-- Solar panels left -->
    <rect x="-38" y="-2" width="26" height="4" fill="#2a3a7a" opacity="0.9"/>
    <rect x="-36" y="-3" width="22" height="6" fill="none" stroke="#4455aa" stroke-width="0.5" opacity="0.6"/>
    <!-- Solar panels right -->
    <rect x="12" y="-2" width="26" height="4" fill="#2a3a7a" opacity="0.9"/>
    <rect x="14" y="-3" width="22" height="6" fill="none" stroke="#4455aa" stroke-width="0.5" opacity="0.6"/>
    <!-- Antenna -->
    <line x1="0" y1="-5" x2="0" y2="-12" stroke="#c0c8d0" stroke-width="0.8"/>
    <circle cx="0" cy="-12" r="2" fill="none" stroke="#c0c8d0" stroke-width="0.8"/>
    <animateTransform attributeName="transform" type="translate"
      values="1200,290; 1250,255; 1310,235; 1375,230; 1435,240; 1485,265; 1510,300; 1500,340; 1470,375; 1420,400; 1360,415; 1295,415; 1240,400; 1200,370; 1180,335; 1180,295; 1200,290"
      dur="28s" repeatCount="indefinite"/>
  </g>

  <!-- === MOON SURFACE === -->

  <!-- Distant horizon dust haze -->
  <ellipse cx="960" cy="470" rx="1200" ry="80" fill="#8a8578" opacity="0.18" filter="url(#dustBlur)"/>

  <!-- Far background moon surface (distant, smooth) -->
  <path d="M0,480 Q200,455 400,462 Q600,468 800,460 Q1000,452 1200,460 Q1400,468 1600,455 Q1800,448 1920,462 L1920,1080 L0,1080 Z"
        fill="url(#moonHorizon)" opacity="0.6"/>

  <!-- Mid-distance surface layer -->
  <path d="M0,500 Q150,478 320,485 Q500,492 700,482 Q900,472 1100,480 Q1300,488 1500,476 Q1700,467 1920,478 L1920,1080 L0,1080 Z"
        fill="#7a7570" opacity="0.55"/>

  <!-- Main moon surface -->
  <path d="M0,530 Q100,510 250,518 Q420,526 600,514 Q780,502 950,512 Q1120,522 1300,510 Q1480,498 1650,510 Q1800,522 1920,510 L1920,1080 L0,1080 Z"
        fill="url(#moonSurf)"/>

  <!-- Surface variation patches (darker areas) -->
  <ellipse cx="300" cy="620" rx="250" ry="80" fill="#5a5650" opacity="0.25"/>
  <ellipse cx="900" cy="650" rx="300" ry="90" fill="#6a6560" opacity="0.2"/>
  <ellipse cx="1500" cy="600" rx="200" ry="70" fill="#5a5650" opacity="0.22"/>
  <ellipse cx="600" cy="800" rx="350" ry="120" fill="#4e4c46" opacity="0.18"/>
  <ellipse cx="1300" cy="750" rx="300" ry="100" fill="#5a5650" opacity="0.2"/>

  <!-- Foreground surface with more texture -->
  <path d="M0,620 Q200,600 450,610 Q700,620 950,608 Q1200,596 1450,606 Q1700,616 1920,604 L1920,1080 L0,1080 Z"
        fill="url(#moonFG)" opacity="0.5"/>

  <!-- === CRATERS === -->

  <!-- Far background craters (small, subtle) -->
  <g opacity="0.5">
    <ellipse cx="150" cy="490" rx="22" ry="8" fill="#5a5650" opacity="0.5"/>
    <ellipse cx="150" cy="490" rx="22" ry="8" fill="none" stroke="#9b9488" stroke-width="1" opacity="0.4"/>

    <ellipse cx="380" cy="475" rx="18" ry="7" fill="#5a5650" opacity="0.45"/>
    <ellipse cx="680" cy="468" rx="28" ry="10" fill="#4e4c46" opacity="0.5"/>
    <ellipse cx="680" cy="468" rx="28" ry="10" fill="none" stroke="#8a8578" stroke-width="1.5" opacity="0.4"/>

    <ellipse cx="950" cy="472" rx="16" ry="6" fill="#5a5650" opacity="0.4"/>
    <ellipse cx="1200" cy="466" rx="24" ry="9" fill="#4e4c46" opacity="0.5"/>
    <ellipse cx="1500" cy="470" rx="20" ry="8" fill="#5a5650" opacity="0.45"/>
    <ellipse cx="1750" cy="475" rx="30" ry="11" fill="#4e4c46" opacity="0.5"/>
  </g>

  <!-- Mid-ground craters -->
  <g opacity="0.75">
    <!-- Large crater center-left -->
    <ellipse cx="250" cy="560" rx="65" ry="22" fill="#4e4c46" opacity="0.7"/>
    <ellipse cx="250" cy="558" rx="65" ry="22" fill="none" stroke="#b0a898" stroke-width="2" opacity="0.5"/>
    <ellipse cx="258" cy="556" rx="65" ry="22" fill="none" stroke="#6a6560" stroke-width="1" opacity="0.3"/>
    <!-- Crater floor -->
    <ellipse cx="250" cy="560" rx="45" ry="14" fill="#5a5850" opacity="0.6"/>

    <!-- Medium crater right -->
    <ellipse cx="850" cy="545" rx="50" ry="17" fill="#4a4840" opacity="0.65"/>
    <ellipse cx="850" cy="543" rx="50" ry="17" fill="none" stroke="#a89888" stroke-width="1.5" opacity="0.5"/>
    <ellipse cx="850" cy="545" rx="35" ry="11" fill="#545250" opacity="0.5"/>

    <!-- Medium crater far right -->
    <ellipse cx="1600" cy="538" rx="55" ry="19" fill="#4e4c46" opacity="0.6"/>
    <ellipse cx="1600" cy="536" rx="55" ry="19" fill="none" stroke="#b0a898" stroke-width="1.5" opacity="0.4"/>
    <ellipse cx="1600" cy="538" rx="38" ry="13" fill="#545250" opacity="0.5"/>

    <!-- Small crater cluster -->
    <ellipse cx="1100" cy="555" rx="30" ry="10" fill="#4a4840" opacity="0.6"/>
    <ellipse cx="1100" cy="553" rx="30" ry="10" fill="none" stroke="#9a9280" stroke-width="1" opacity="0.4"/>

    <ellipse cx="1130" cy="568" rx="20" ry="7" fill="#4a4840" opacity="0.55"/>
    <ellipse cx="470" cy="548" rx="35" ry="12" fill="#4e4c46" opacity="0.6"/>
  </g>

  <!-- Foreground craters (large, detailed) -->
  <!-- Big crater front-left -->
  <ellipse cx="180" cy="680" rx="120" ry="40" fill="#3e3c38" opacity="0.7"/>
  <ellipse cx="183" cy="675" rx="120" ry="40" fill="none" stroke="#c0bab0" stroke-width="3" opacity="0.5"/>
  <ellipse cx="186" cy="670" rx="118" ry="39" fill="none" stroke="#9b9488" stroke-width="1" opacity="0.3"/>
  <!-- Shadow inside crater -->
  <ellipse cx="165" cy="680" rx="90" ry="28" fill="#2a2a26" opacity="0.6"/>
  <!-- Bright rim highlight (sun from right) -->
  <path d="M300,680 Q300,660 270,660 Q240,660 230,655" fill="none" stroke="#d0ccc0" stroke-width="2.5" opacity="0.6"/>

  <!-- Medium foreground crater center -->
  <ellipse cx="960" cy="650" rx="90" ry="30" fill="#3e3c38" opacity="0.65"/>
  <ellipse cx="963" cy="646" rx="90" ry="30" fill="none" stroke="#b8b0a0" stroke-width="2" opacity="0.5"/>
  <ellipse cx="950" cy="650" rx="68" ry="22" fill="#2e2c28" opacity="0.55"/>
  <!-- Bright rim -->
  <path d="M1050,648 Q1050,630 1020,628" fill="none" stroke="#ccc4b4" stroke-width="2" opacity="0.55"/>

  <!-- Right foreground crater -->
  <ellipse cx="1700" cy="670" rx="100" ry="34" fill="#3a3836" opacity="0.65"/>
  <ellipse cx="1703" cy="666" rx="100" ry="34" fill="none" stroke="#bab2a2" stroke-width="2.5" opacity="0.5"/>
  <ellipse cx="1690" cy="670" rx="75" ry="24" fill="#2a2826" opacity="0.55"/>

  <!-- Small craters scattered foreground -->
  <ellipse cx="600" cy="700" rx="40" ry="13" fill="#3e3c38" opacity="0.6"/>
  <ellipse cx="602" cy="697" rx="40" ry="13" fill="none" stroke="#a09888" stroke-width="1.5" opacity="0.4"/>
  <ellipse cx="600" cy="700" rx="28" ry="9" fill="#323028" opacity="0.5"/>

  <ellipse cx="1350" cy="720" rx="50" ry="17" fill="#3a3836" opacity="0.6"/>
  <ellipse cx="1353" cy="716" rx="50" ry="17" fill="none" stroke="#a8a090" stroke-width="1.5" opacity="0.4"/>
  <ellipse cx="1350" cy="720" rx="36" ry="12" fill="#2e2c28" opacity="0.5"/>

  <!-- === ROCKS === -->

  <!-- Background/mid rocks (small, subtle) -->
  <g opacity="0.6">
    <polygon points="420,540 440,520 460,540 455,545 425,545" fill="#7a7570"/>
    <polygon points="421,540 441,521 461,540 456,544 426,544" fill="none" stroke="#4a4840" stroke-width="0.5" opacity="0.5"/>
    <ellipse cx="445" cy="542" rx="8" ry="3" fill="#3a3830" opacity="0.5"/>

    <polygon points="720,528 745,510 765,528 760,534 725,534" fill="#7a7570"/>
    <ellipse cx="740" cy="531" rx="10" ry="3" fill="#3a3830" opacity="0.4"/>

    <polygon points="1050,522 1070,507 1085,522 1080,527 1055,527" fill="#6e6a62"/>
    <ellipse cx="1067" cy="525" rx="8" ry="2.5" fill="#3a3830" opacity="0.4"/>

    <polygon points="1400,515 1428,498 1448,515 1442,521 1406,521" fill="#7a7570"/>
    <ellipse cx="1424" cy="518" rx="10" ry="3" fill="#3a3830" opacity="0.4"/>
  </g>

  <!-- Mid-ground rocks -->
  <g opacity="0.8">
    <polygon points="320,575 360,548 390,575 380,585 330,585" fill="#8a8578"/>
    <polygon points="321,575 361,549 390,574 379,584 331,584" fill="none" stroke="#5a5650" stroke-width="0.8" opacity="0.4"/>
    <ellipse cx="355" cy="582" rx="22" ry="6" fill="#2e2c28" opacity="0.45"/>

    <polygon points="1200,562 1240,535 1265,562 1255,572 1210,572" fill="#8a8578"/>
    <ellipse cx="1235" cy="569" rx="20" ry="6" fill="#2e2c28" opacity="0.4"/>

    <polygon points="560,585 595,560 618,585 610,595 568,595" fill="#9b9488"/>
    <ellipse cx="590" cy="592" rx="22" ry="7" fill="#2e2c28" opacity="0.4"/>
  </g>

  <!-- Foreground rocks (large, detailed) -->
  <!-- Big rock front-right -->
  <polygon points="1750,610 1820,565 1875,580 1890,620 1860,645 1760,645 1740,632" fill="#9b9488"/>
  <polygon points="1820,565 1875,580 1870,572 1823,558" fill="#b8b0a0"/>
  <polygon points="1750,610 1760,645 1740,632" fill="#6a6560"/>
  <ellipse cx="1815" cy="643" rx="70" ry="12" fill="#2a2826" opacity="0.55"/>

  <!-- Medium rock left-of-center -->
  <polygon points="680,650 730,615 775,625 785,660 740,678 685,668" fill="#9b9488"/>
  <polygon points="730,615 775,625 772,616 733,607" fill="#b0a898"/>
  <polygon points="680,650 685,668 672,660" fill="#6a6560"/>
  <ellipse cx="732" cy="676" rx="52" ry="10" fill="#252320" opacity="0.5"/>

  <!-- Rock cluster left foreground -->
  <polygon points="80,720 125,685 160,695 170,730 130,748 85,738" fill="#8a8578"/>
  <polygon points="125,685 160,695 158,686 128,676" fill="#a8a090"/>
  <ellipse cx="125" cy="746" rx="45" ry="9" fill="#222018" opacity="0.5"/>

  <polygon points="145,710 180,680 205,690 212,720 180,735 148,724" fill="#9b9488"/>
  <polygon points="180,680 205,690 203,681 182,671" fill="#b0a898"/>

<script>
(function() {
  'use strict';

  // Seeded PRNG (mulberry32)
  function seededRand(seed) {
    return function() {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  var rand = seededRand(0xDEADBEEF);
  var svgNS = 'http://www.w3.org/2000/svg';

  var starsContainer = document.getElementById('stars');
  var brightContainer = document.getElementById('brightStars');

  var moonHorizonY = 510; // px in viewBox
  var W = 1920, H = 1080;

  // Milky Way band: more density along a diagonal band
  function milkyWayDensity(x, y) {
    // Band roughly from (200,500) to (1700, 100)
    var bx = x / W;
    var by = y / (moonHorizonY);
    var angle = -0.25;
    var rotated = bx * Math.cos(angle) - by * Math.sin(angle);
    var band = Math.exp(-Math.pow((rotated - 0.45) / 0.22, 2));
    return 0.3 + 0.7 * band;
  }

  // Generate regular dim stars
  var totalStars = 2200;
  for (var i = 0; i < totalStars; i++) {
    var x, y;
    var attempts = 0;
    do {
      x = rand() * W;
      y = rand() * moonHorizonY * 1.02;
      attempts++;
    } while (rand() > milkyWayDensity(x, y) && attempts < 8);

    if (y >= moonHorizonY + 10) continue;

    var r = 0.25 + rand() * 0.65;
    var brightness = 0.3 + rand() * 0.7;

    // Star color: mostly white-blue, some warm
    var hue = rand();
    var cr, cg, cb;
    if (hue < 0.6) {
      // Blue-white
      cr = Math.floor(200 + rand() * 55);
      cg = Math.floor(210 + rand() * 45);
      cb = 255;
    } else if (hue < 0.85) {
      // Pure white
      var v = Math.floor(230 + rand() * 25);
      cr = cg = cb = v;
    } else {
      // Warm yellow-white
      cr = 255;
      cg = Math.floor(230 + rand() * 25);
      cb = Math.floor(180 + rand() * 50);
    }

    var circle = document.createElementNS(svgNS, 'circle');
    circle.setAttribute('cx', x.toFixed(2));
    circle.setAttribute('cy', y.toFixed(2));
    circle.setAttribute('r', r.toFixed(2));
    circle.setAttribute('fill', 'rgb(' + cr + ',' + cg + ',' + cb + ')');
    circle.setAttribute('opacity', brightness.toFixed(2));

    // Add subtle twinkle to some stars
    if (rand() < 0.35) {
      var dur = (3 + rand() * 5).toFixed(1) + 's';
      var minOp = (brightness * 0.4).toFixed(2);
      var maxOp = brightness.toFixed(2);
      var anim = document.createElementNS(svgNS, 'animate');
      anim.setAttribute('attributeName', 'opacity');
      anim.setAttribute('values', maxOp + ';' + minOp + ';' + maxOp);
      anim.setAttribute('dur', dur);
      anim.setAttribute('begin', (rand() * 8).toFixed(1) + 's');
      anim.setAttribute('repeatCount', 'indefinite');
      circle.appendChild(anim);
    }

    starsContainer.appendChild(circle);
  }

  // Generate medium stars
  for (var j = 0; j < 180; j++) {
    var mx = rand() * W;
    var my = rand() * moonHorizonY * 0.98;
    if (my >= moonHorizonY) continue;

    var mr = 0.9 + rand() * 1.1;
    var mop = 0.55 + rand() * 0.45;

    var mc = document.createElementNS(svgNS, 'circle');
    mc.setAttribute('cx', mx.toFixed(1));
    mc.setAttribute('cy', my.toFixed(1));
    mc.setAttribute('r', mr.toFixed(2));
    mc.setAttribute('fill', '#e8eeff');
    mc.setAttribute('opacity', mop.toFixed(2));
    mc.setAttribute('filter', 'url(#starGlow)');

    if (rand() < 0.5) {
      var mdur = (4 + rand() * 4).toFixed(1) + 's';
      var mmin = (mop * 0.45).toFixed(2);
      var manim = document.createElementNS(svgNS, 'animate');
      manim.setAttribute('attributeName', 'opacity');
      manim.setAttribute('values', mop.toFixed(2) + ';' + mmin + ';' + mop.toFixed(2));
      manim.setAttribute('dur', mdur);
      manim.setAttribute('begin', (rand() * 10).toFixed(1) + 's');
      manim.setAttribute('repeatCount', 'indefinite');
      mc.appendChild(manim);
    }

    starsContainer.appendChild(mc);
  }

  // Bright stars with diffraction spikes
  var brightPositions = [
    [120, 95, 2.8, '#fffde8', 0.95],
    [445, 65, 2.2, '#e8f0ff', 0.9],
    [780, 130, 2.5, '#fff8e0', 0.88],
    [1050, 55, 2.0, '#e8f0ff', 0.92],
    [1550, 110, 2.6, '#fffde8', 0.9],
    [1850, 180, 1.8, '#e8f0ff', 0.85],
    [290, 240, 2.1, '#fff0e8', 0.82],
    [1680, 320, 2.3, '#e8f0ff', 0.88],
    [620, 190, 1.9, '#fffde8', 0.8],
    [1200, 160, 2.4, '#e8f8ff', 0.87],
    [950, 85, 2.0, '#fff8f0', 0.85],
    [1750, 70, 2.5, '#e8f0ff', 0.9],
    [60, 350, 1.8, '#fffde8', 0.8],
    [1900, 420, 1.7, '#e8f0ff', 0.78],
  ];

  brightPositions.forEach(function(bp) {
    var bx = bp[0], by = bp[1], br = bp[2], bc = bp[3], bop = bp[4];

    var g = document.createElementNS(svgNS, 'g');

    // Glow circle
    var glow = document.createElementNS(svgNS, 'circle');
    glow.setAttribute('cx', bx);
    glow.setAttribute('cy', by);
    glow.setAttribute('r', (br * 3.5).toFixed(1));
    glow.setAttribute('fill', bc);
    glow.setAttribute('opacity', '0.18');
    glow.setAttribute('filter', 'url(#brightStarGlow)');
    g.appendChild(glow);

    // Core
    var core = document.createElementNS(svgNS, 'circle');
    core.setAttribute('cx', bx);
    core.setAttribute('cy', by);
    core.setAttribute('r', br.toFixed(2));
    core.setAttribute('fill', bc);
    core.setAttribute('opacity', bop);
    g.appendChild(core);

    // Diffraction spikes
    var spikeLen = br * 10 + rand() * br * 5;
    var spikeW = 0.6;
    var angles = [0, 90, 45, 135];
    angles.forEach(function(angle) {
      var rad = angle * Math.PI / 180;
      var dx = Math.cos(rad) * spikeLen;
      var dy = Math.sin(rad) * spikeLen;
      var line = document.createElementNS(svgNS, 'line');
      line.setAttribute('x1', (bx - dx).toFixed(1));
      line.setAttribute('y1', (by - dy).toFixed(1));
      line.setAttribute('x2', (bx + dx).toFixed(1));
      line.setAttribute('y2', (by + dy).toFixed(1));
      line.setAttribute('stroke', bc);
      line.setAttribute('stroke-width', spikeW);
      line.setAttribute('opacity', (bop * 0.4).toFixed(2));
      g.appendChild(line);
    });

    // Twinkle
    var btdur = (3 + rand() * 5).toFixed(1) + 's';
    var btanim = document.createElementNS(svgNS, 'animate');
    btanim.setAttribute('attributeName', 'opacity');
    btanim.setAttribute('values', '1;0.6;1');
    btanim.setAttribute('dur', btdur);
    btanim.setAttribute('begin', (rand() * 8).toFixed(1) + 's');
    btanim.setAttribute('repeatCount', 'indefinite');
    g.appendChild(btanim);

    brightContainer.appendChild(g);
  });

  // Animate satellite orbit
  // (Already handled by SVG animateTransform)

})();
</script>
